# ============================================================
# docker-compose — نظام إدارة رياضية
# الخدمات: db (MariaDB 11) + app (Next.js) + worker (المهام المجدولة)
#          + proxy (nginx/TLS — اختياري عبر profile: proxy)
#
# لم يُختبر هذا الملف بعد النقل إلى MySQL — NOT VERIFIED (المسار المُختبَر محليًا هو XAMPP/localhost).
#
# التهيئة الأولى (بعد docker compose up -d db):
#   docker compose run --rm app npx prisma db push
#   docker compose run --rm app bash -c 'mysql -h db -u root -p"$MYSQL_ROOT_PASSWORD" sports_management < prisma/raw-constraints.sql'
#   docker compose run --rm app npm run seed
# ملاحظة: mysql يقرأ DATABASE_URL من بيئة الحاوية (env_file: .env).
# ============================================================

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?حدد MYSQL_ROOT_PASSWORD في .env}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-sports_management}
      TZ: ${APP_TIMEZONE:-Africa/Algiers}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MARIADB_ROOT_PASSWORD"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # لا تُعرَّض القاعدة للإنترنت في الإنتاج — أزلِ المنافذ واجعل الوصول عبر الشبكة الداخلية فقط
    ports:
      - '127.0.0.1:3306:3306'

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE:-sports_management}
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_private:/app/storage/private
      - storage_backups:/app/storage/backups
    ports:
      - '127.0.0.1:3000:3000'

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE:-sports_management}
      WORKER_INTERVAL_MINUTES: ${WORKER_INTERVAL_MINUTES:-15}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_private:/app/storage/private
      - storage_backups:/app/storage/backups
    command: ['npx', 'tsx', 'scripts/worker.ts']

  # وكيل عكسي اختياري بـ HTTPS — فعّله بـ:
  #   docker compose --profile proxy up -d
  # ضع شهاداتك في docker/certs/{fullchain.pem,privkey.pem}
  proxy:
    image: nginx:1.27-alpine
    profiles: ['proxy']
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro

volumes:
  dbdata:
  storage_private:
  storage_backups:
