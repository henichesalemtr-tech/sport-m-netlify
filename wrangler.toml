[build]
command = "npm run build"
root_dir = "."
publish_dir = ".next"

[env.production]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"

[[redirects]]
from = "/api/*"
to = "/api/:splat"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
