# nginx — وكيل عكسي للتطبيق (docker compose --profile proxy)
# الشهادات: docker/certs/fullchain.pem و docker/certs/privkey.pem
# لم يُختبر في بيئة التوثيق (لا docker هنا) — NOT VERIFIED.

# إعادة توجيه HTTP → HTTPS
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _; # عدّله إلى نطاقك

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  # حدود الرفع — طابقها مع STORAGE_MAX_*_MB في .env (أكبر قليلًا للسماح بـ multipart)
  client_max_body_size 15m;

  # ترويسات أمان إضافية على مستوى الوكيل (التطبيق يرسل ترويساته أيضًا عبر next.config.js)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
